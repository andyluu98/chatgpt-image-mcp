[project]
name = "cgimg"
version = "0.1.0"
description = "Standalone MCP server for ChatGPT image generation + PPT building"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "curl_cffi>=0.7.0",
    "pillow>=10.0.0",
    "pybase64>=1.3.0",
    "python-pptx>=1.0.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.110.0",
    "feedparser>=6.0",
    "yt-dlp>=2024.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "loguru>=0.7",
    "rich>=13.0",
    "browser_cookie3>=0.19",
    "rookiepy>=0.5",
]

[project.scripts]
cgimg = "cgimg.cli:main"
cgimg-mcp = "cgimg.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgimg"]

[dependency-groups]
dev = ["pytest>=8.0"]
